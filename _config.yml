title: Security, Privacy & GRC Roadmap
description: A free, opinionated, India-aware practitioner roadmap into Security, Privacy, and GRC. Persona paths, 18 modules, reference materials, interview prep, and capstone scenarios.
url: "https://sathyasivam-grcnexis.github.io"
baseurl: "/security-privacy-grc-roadmap"

author:
  name: Sathya Sivam
  github: SathyaSivam-GRCNexis

repository: SathyaSivam-GRCNexis/security-privacy-grc-roadmap

markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge
  hard_wrap: false

permalink: /:path/

include:
  - README.md

exclude:
  - .gitignore
  - .github
  - Gemfile
  - Gemfile.lock
  - vendor
  - node_modules
  - CONTRIBUTING.md
  - CODE_OF_CONDUCT.md
  - CHANGELOG.md
  - LICENSE
  - "*.gemspec"

defaults:
  - scope:
      path: ""
    values:
      layout: default
  - scope:
      path: "modules"
    values:
      layout: page
      section: Modules
  - scope:
      path: "paths"
    values:
      layout: page
      section: Persona Paths
  - scope:
      path: "reference"
    values:
      layout: page
      section: Reference
  - scope:
      path: "scenarios"
    values:
      layout: page
      section: Scenarios
  - scope:
      path: "interview-prep"
    values:
      layout: page
      section: Interview Prep
  - scope:
      path: "START-HERE.md"
    values:
      layout: page
      section: Start Here
  - scope:
      path: "faq.md"
    values:
      layout: page
      section: FAQ

# Categorised framework grid for the hero
framework_groups:
  - heading: ISO Standards
    items:
      - { name: "ISO 27001:2022", tag: "ISMS" }
      - { name: "ISO 27701", tag: "PIMS" }
      - { name: "ISO 22301", tag: "BCMS" }
      - { name: "ISO 27017", tag: "Cloud" }
      - { name: "ISO 27018", tag: "Cloud PII" }
      - { name: "ISO 31000", tag: "Risk" }
      - { name: "ISO 9001", tag: "Quality" }
  - heading: Privacy & Data Protection
    items:
      - { name: "GDPR", tag: "EU" }
      - { name: "DPDP Act 2023", tag: "India" }
      - { name: "HIPAA", tag: "US" }
      - { name: "PCI-DSS 4.0.1", tag: "Payments" }
  - heading: Risk & Security Frameworks
    items:
      - { name: "NIST CSF 2.0", tag: "US" }
      - { name: "NIST 800-53 r5", tag: "US" }
      - { name: "SOC 2", tag: "AICPA" }
      - { name: "CSA STAR", tag: "Cloud" }
  - heading: AI Governance & AppSec
    items:
      - { name: "ISO 42001", tag: "AIMS" }
      - { name: "EU AI Act", tag: "EU" }
      - { name: "OWASP Top 10", tag: "Web/API" }
      - { name: "OWASP LLM 2025", tag: "AI" }
  - heading: India Regulations
    items:
      - { name: "RBI Cyber Framework", tag: "India" }
      - { name: "SEBI CSCRF", tag: "India" }

# Persona path cards (landing)
paths:
  - { num: "01", slug: "paths/00-non-tech-beginner", title: "Non-Tech Beginner", who: "Exploring whether security, privacy, or GRC is for you", focus: "Foundation pack + GRC core (Modules 0, 1, 3, 5–10)", color: "green" }
  - { num: "02", slug: "paths/01-career-shifter", title: "Career Shifter", who: "From law, finance, audit, ops, or project management", focus: "Full curriculum, extra weight on Modules 5–12", color: "amber" }
  - { num: "03", slug: "paths/02-tech-professional", title: "Tech Professional", who: "Dev / SRE / cloud moving into security or GRC", focus: "Fast pass through basics, deep on Modules 7–15", color: "pink" }

